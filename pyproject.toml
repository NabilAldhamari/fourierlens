[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourierlens"
description = "Interactive Fourier analysis for computer vision research - explore, annotate, and batch-audit images in the frequency domain."
readme = "README.md"
dynamic = ["version"]
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FourierLens contributors" }]
keywords = ["fourier", "fft", "computer-vision", "image-analysis", "frequency-domain", "spectrum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "tifffile>=2023.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "ruff>=0.6", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/NabilAldhamari/fourierlens"
Source = "https://github.com/NabilAldhamari/fourierlens"
Changelog = "https://github.com/NabilAldhamari/fourierlens/blob/main/CHANGELOG.md"
Issues = "https://github.com/NabilAldhamari/fourierlens/issues"

[project.scripts]
fourierlens = "fourierlens.cli:main"

[tool.hatch.version]
path = "src/fourierlens/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/fourierlens"]
# ship the demo gallery inside the package so pip/uvx users get a working first run
force-include = { "samples" = "fourierlens/samples" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "samples", "frontend/src", "frontend/*.json", "frontend/*.ts", "frontend/*.html", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = [
    # Starlette suggests httpx2; keep httpx so older Starlette releases still work
    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]
