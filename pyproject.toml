[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fourierlens"
version = "0.1.0"
description = "Interactive Fourier analysis for computer vision research - explore, annotate, and batch-audit images in the frequency domain."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "FourierLens contributors" }]
keywords = ["fourier", "fft", "computer-vision", "image-analysis", "frequency-domain", "spectrum"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "pillow>=10.0",
    "tifffile>=2023.1.1",
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "python-multipart>=0.0.9",
    "pandas>=2.0",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.urls]
Homepage = "https://github.com/fourierlens/fourierlens"

[project.scripts]
fourierlens = "fourierlens.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/fourierlens"]
# ship the demo gallery inside the package so pip/uvx users get a working first run
force-include = { "samples" = "fourierlens/samples" }

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "samples", "frontend/src", "frontend/*.json", "frontend/*.ts", "frontend/*.html", "README.md", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
